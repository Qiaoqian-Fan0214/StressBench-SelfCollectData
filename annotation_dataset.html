<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-Collection 标注页</title>
  <link rel="stylesheet" href="annotation.css" />
</head>
<body>
  <div class="shell compact-shell">
    <header class="page-header compact-header">
      <div class="toolbar compact-topbar">
        <div>
          <a class="button" href="annotation_index.html">返回标注入口</a>
        </div>
      </div>
      <h1 id="datasetTitle">加载中</h1>
      <p id="datasetDesc" class="sub"></p>
    </header>

    <main>
      <div class="two-col compact-main" style="margin-top: 12px;">
        <section class="panel compact-panel media-panel">
          <div class="viewer-grid compact-viewer-grid">
            <div class="media-card">
              <div id="primaryMediaTitle" class="media-title">RGB</div>
              <div class="media-wrap compact-media-wrap">
                <img id="primaryImage" alt="Primary media" />
                <canvas id="maskCanvas" class="mask-overlay"></canvas>
                <div id="primaryBboxLayer" class="bbox-layer" aria-hidden="true"></div>
                <div id="primaryBbox" class="bbox-box"></div>
              </div>
            </div>
            <div class="media-card">
              <div id="secondaryMediaTitle" class="media-title">RGB</div>
              <div class="media-wrap compact-media-wrap">
                <img id="secondaryImage" alt="Secondary media" />
                <div id="secondaryBboxLayer" class="bbox-layer" aria-hidden="true"></div>
                <div id="secondaryBbox" class="bbox-box"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="panel compact-panel info-panel">
          <h2>样本信息</h2>
          <div class="info-list compact-info-list">
            <div><strong>sample_id：</strong> <span id="sampleIdText" class="path">-</span></div>
            <div><strong>source file：</strong> <span id="officialIdText" class="path muted">-</span></div>
            <div><strong>当前阶段：</strong> <span id="categoryLabelZhText" class="muted">-</span></div>
            <div><strong>候选物体：</strong> <span id="candidateCountText">-</span></div>
            <div><strong>当前任务数：</strong> <span id="taskCountText">-</span></div>
            <div class="info-stack">
              <strong>高置信候选：</strong>
              <div id="candidateSummaryText" class="info-multiline muted">加载后显示</div>
            </div>
            <div><strong>RGB path：</strong> <span id="rgbPathText" class="path">-</span></div>
            <div><strong>updated_at：</strong> <span id="updatedAtText">-</span></div>
          </div>
        </section>
      </div>

      <section class="panel compact-panel task-panel" style="margin-top: 12px;">
        <div class="task-panel-head">
          <div>
            <h2>Task / Instruction / GT 标注</h2>
            <p class="sub compact-subnote">
              当前图片可以连续添加多道题。`target_grounding` 会自动拆成 bbox 与 mask 两个 json；其他模板一题对应一个 json。
            </p>
          </div>
          <div class="toolbar-group">
            <button id="addTaskButton" type="button" class="primary">添加任务</button>
            <button id="undoAddTaskButton" type="button">回退添加</button>
          </div>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>

      <section class="panel compact-panel action-panel" style="margin-top: 12px;">
        <div class="toolbar action-toolbar">
          <div class="toolbar-group">
            <button id="saveNextButton" type="button" class="primary">保存并下一张</button>
            <button id="discardButton" type="button" class="warn">舍弃并下一张</button>
          </div>
          <div class="action-summary">
            <span id="statusPill" class="pill unprocessed">当前样本：未处理</span>
            <span id="positionPill" class="pill position">当前位置：0 / 0</span>
            <div class="action-progress unified-progress compact-progress">
              <div class="progress-metrics">
                <div class="progress-metric">
                  <span class="progress-metric-label">已处理</span>
                  <strong id="processedSummaryValue" class="progress-metric-value">0</strong>
                </div>
                <div class="progress-metric annotated">
                  <span class="progress-metric-label">已标注</span>
                  <strong id="annotatedSummaryValue" class="progress-metric-value">0</strong>
                </div>
                <div class="progress-metric warn">
                  <span class="progress-metric-label">已舍弃</span>
                  <strong id="discardedSummaryValue" class="progress-metric-value">0</strong>
                </div>
              </div>
              <div class="stacked-progress">
                <div id="annotatedSummaryBar" class="stacked-progress-segment annotated"></div>
                <div id="discardedSummaryBar" class="stacked-progress-segment discarded"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="toolbar action-subtoolbar compact-toolbar">
          <div class="toolbar-group">
            <div id="scopeField" class="field hidden">
              <label for="scopeSelect">分工范围</label>
              <select id="scopeSelect"></select>
            </div>
            <div class="field">
              <label for="subcategorySelect">子类</label>
              <select id="subcategorySelect"></select>
            </div>
          </div>
          <div class="toolbar-group">
            <button id="prevButton" type="button">上一张</button>
            <button id="nextButton" type="button">下一张</button>
          </div>
        </div>
        <div id="statusLine" class="status-line action-status-line"></div>
      </section>
    </main>
  </div>

  <script type="module" src="annotation_dataset.js"></script>
</body>
</html>
