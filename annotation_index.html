<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-Collection 标注入口</title>
  <link rel="stylesheet" href="annotation.css" />
</head>
<body>
  <div class="shell narrow compact-shell">
    <header class="page-header compact-header">
      <h1>Self-Collection 标注入口</h1>
      <p class="sub">
        这里是自标数据的人工 stress 标注根页。当前阶段只标注 stress，后续会在同一套结构上继续补 task、instruction、gt 和问题选项。
      </p>
      <div class="index-note">
        <p class="sub">
          请通过本地 HTTP 服务打开本页，例如运行
          <code>python annotation_server.py</code>
          后访问 <code>http://127.0.0.1:8766/annotation_index.html</code>。
          正式标注结果会写入当前目录下的 <code>annotation_hub/</code>，本地续标游标和日志写到
          <code>.annotation_state/</code>。图片直接读取当前目录下各子类文件夹。
        </p>
      </div>
    </header>

    <main>
      <div id="statusLine" class="status-line"></div>
      <section id="cardGrid" class="grid cards" aria-label="评测集标注卡片"></section>
    </main>
  </div>

  <script type="module" src="annotation_index.js"></script>
</body>
</html>
